name: release

on:
  push:
    branches: [main]

# Changesets uses this token to commit the version branch and open its pull request.
permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Node 24 bundles npm 11.x. npm trusted publishing (OIDC) needs npm >= 11.5.1;
          # Node 22's npm 10.x publishes unauthenticated and gets a masked 404 on
          # scoped packages.
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Create version pull request or publish packages
        # Action v2 pairs with @changesets/cli v3. Under v1 the CLI v3 publish output
        # does not parse, so the action pushes no tags and creates no GitHub release.
        uses: changesets/action@v2
        with:
          commit-message: "chore: version packages"
          version-script: pnpm run version
          publish-script: pnpm run release
          github-token: ${{ secrets.GITHUB_TOKEN }}
